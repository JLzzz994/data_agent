logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: ${oc.env:META_DB_HOST,localhost}
  port: ${oc.env:META_DB_PORT,3306}
  user: ${oc.env:META_DB_USER,meta_reader}
  password: ${oc.env:META_DB_PASSWORD,change-me}
  database: ${oc.env:META_DB_NAME,meta}

db_dw:
  host: ${oc.env:DW_DB_HOST,localhost}
  port: ${oc.env:DW_DB_PORT,3306}
  user: ${oc.env:DW_DB_USER,huijingying_readonly}
  password: ${oc.env:DW_DB_PASSWORD,change-me}
  database: ${oc.env:DW_DB_NAME,dw}

milvus:
  host: ${oc.env:MILVUS_HOST,localhost}
  port: ${oc.env:MILVUS_PORT,19530}
  token: ${oc.env:MILVUS_TOKEN,}
  embedding_size: 1024

embedding:
  host: ${oc.env:EMBEDDING_HOST,localhost}
  port: ${oc.env:EMBEDDING_PORT,9080}
  model: BAAI/bge-large-zh-v1.5

es:
  host: ${oc.env:ES_HOST,localhost}
  port: ${oc.env:ES_PORT,9200}
  index_name: huice-data-agent

llm:
  model_name: ${oc.env:LLM_MODEL,Qwen2.5-14B-Instruct}
  api_key: ${oc.env:LLM_API_KEY,EMPTY}
  base_url: ${oc.env:LLM_BASE_URL,http://localhost:8000/v1}
  model_provider: openai
