name: Huijingying Data Agent CI

on:
  push:
    branches:
      - "feat/huice-huijingying-data-agent"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Install test dependencies
        run: python -m pip install "sqlglot>=25.0.0" "pymilvus>=2.6.0,<2.7"

      - name: Compile Python sources
        run: python -m compileall -q app evaluation test

      - name: Run deterministic quality gates
        run: >-
          python -m unittest
          test.test_sql_guard
          test.test_scoped_sql
          test.test_milvus_contract
          test.test_evaluation_core
          test.test_evaluation_dataset
